[package]
name = "mapcheck"
version = "0.1.0"
edition = "2021"
description = "Test framework for the mapping from XBRL tags to the standard DCF input variables"
publish = false

[dependencies]
flate2 = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
