[package]
name = "mapcheck"
version = "0.1.0"
edition = "2021"
description = "SEC data to standard DCF input variables: fetch, map, check, filing statements, cross-check"
publish = false

[dependencies]
flate2 = "1"
rayon = "1"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3.1", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[profile.release]
opt-level = 3
lto = "thin"
