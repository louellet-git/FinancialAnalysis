[package]
name = "financial-analysis"
version = "0.1.0"
edition = "2021"
description = "FinancialAnalysis in Rust: SEC mapping, DCF engines, rates, bonds, verdict, backtest, report, options trading research."
publish = false

[lib]
name = "financial_analysis"
path = "src/lib.rs"

[[bin]]
name = "fa"
path = "src/main.rs"

[dependencies]
libm = "0.2"
mapcheck = { path = "mapcheck" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
toml = "0.8"
tiny_http = "0.12"
rust_xlsxwriter = "0.103.0"

# The model tests simulate millions of steps and fit likelihoods: run them optimized.
[profile.test]
opt-level = 3
