[[drivers]]
name = "g_software"
stochastic = true
mean = 0.05
std = 0.025
dist = "truncnorm"
hi = 0.11
rationale = "Largest segment (44%). Organic growth ~3.75-4% (F16 decomposition); acquired growth ~2-2.5pp of which f=MA_RECURRENCE=0.50 is paid for in the margin, crediting ~1pp: mean 5.0% all-in on the charged basis. History footnote (corrected): headline FY22-25 growth of 5-11% mixes recast bases and includes HashiCorp — it is NOT an organic run-rate; guide ~10% and Q2-26 warning +5% bracket the near term. hi=11%: ten straight years at 11%+ on a $30B base has no precedent — the truncation caps that tail. Stochastic: demand-driven, the main uncertainty. RPO evidence (research-ledger.md, consumed per rule R1, expires at the Q2-2026 10-Q): $71.0B backlog, coverage 105% — corroborates the mean; the +12.7% YoY print consolidates HashiCorp obligations and is NOT organic evidence (RPO re-look verdict), so no parameter change."

[[drivers]]
name = "g_consulting"
stochastic = true
mean = 0.0175
std = 0.025
rationale = "FY22-25: +7.1/+5/-1/+2% (recast footnote: Jan-2024 segment change moved Security Services Software->Consulting; growth across that boundary is not like-for-like); guide low-to-mid singles. GenAI is two-sided but the cannibalization left tail (AI does the work) is the heavier side: mean 1.75% and std 2.5% proxy the left-skewed mixture the reviewer derived (implied mean ~1.75%); a true mixture marginal is an engine ticket. Stochastic: cyclical + secular uncertainty. RPO evidence (research-ledger.md, R1, expires at the Q2-2026 10-Q): 2-year contracted cover cannot rebut the 10-year cannibalization thesis (contracts run off; the tail is renewals after AI substitution) — mean unchanged; bear-tail vs backlog reconciliation: violation probability identically zero (year-1 pinned revenue alone exceeds the 2-year contracted amount), so evidence floors were rejected as cosmetic."

[[drivers]]
name = "g_infrastructure"
stochastic = true
mean = -0.01
std = 0.025
dist = "truncnorm"
hi = 0.03
rationale = "Mainframe-cycle sawtooth (+7.8/-5/-4/+12); guide down low singles; Q2-26 -7%. Because the engine holds one draw constant per path (T-DCF-1 embed, disclosed), std must be the dispersion of the 10-YEAR CAGR, not annual volatility: annual sigma ~8.4% with cycle mean-reversion compresses to ~1.5-2.7% at the decade horizon — std 2.5% sits in that band. hi=+3%: a hardware segment compounding >=+3%/yr for a decade has never happened. Mean -1% kept: slightly negative through the cycle."

[[drivers]]
name = "g_financing"
stochastic = false
mean = 0.0
rationale = "DETERMINISTIC flat: 1.1% of revenue; a +/-50% error moves total revenue <0.6% — materiality does not justify a sampled process. Disclosure: the terminal value grows this flat segment at tg like the others (second-order at 1.1% weight). Disclosure: financing volume is not linked to the infrastructure cycle here — that volume link is severed by the flat treatment."

[[drivers]]
name = "core_margin"
stochastic = true
mean = 0.194
std = 0.02
rationale = "Pre-SBC pre-M&A FCFF margin at the FY2025 LEVEL (19.4%): F19 shows the margin declining three straight years, so a 5y mean overstates the starting point — the endpoint is the honest base. The offsetting software-mix improvement is NOT loaded into this mean; it is the separate deterministic margin_mix_drift schedule (implemented together, per the core_margin review). Stochastic: the operational uncertainty core. Std from the v3 per-year dispersion."

[[drivers]]
name = "margin_mix_drift"
stochastic = false
mean = 0.0
schedule = [0.0, 0.0013333333333333333, 0.0026666666666666666, 0.004, 0.005333333333333333, 0.006666666666666666, 0.008, 0.009333333333333332, 0.010666666666666666, 0.012]
rationale = "DETERMINISTIC schedule, linear 0 -> +1.2pp by year 10: software-mix margin drift (per the core_margin review: holding mix flat while software compounds faster than the company contradicts the model's own revenue mix — by y10 the software share implies ~+1.2pp of margin). Deterministic: it is a mechanical consequence of the segment growth means, not an independent random process; the randomness already lives in the growth draws."

[[drivers]]
name = "sbc_ratio"
stochastic = false
mean = 0.0254
schedule = [0.0254, 0.026466666666666666, 0.027533333333333333, 0.0286, 0.029666666666666668, 0.030733333333333335, 0.0318, 0.03286666666666667, 0.033933333333333336, 0.035]
rationale = "DETERMINISTIC schedule, linear 2.54% (FY2025 actual, no flattering rounding) -> 3.5% by year 10: the ratio rose 1.74% -> 2.54% since 2021 and is accelerating — a constant embeds an unexplained trend break. 3.5% is a deliberate partial-persistence choice (full historical pace reaches ~4.5%; MSFT sits at 4.3%): management-set, slow-moving policy, so a schedule not a sampled process. The flat-2.54% / ramp-3.5% / ramp-4.5% locus is published by dcf_drivers_run.py."

[[drivers]]
name = "ma_ratio"
stochastic = true
mean = 0.071
std = 0.024
dist = "truncnorm"
lo = 0.0
rationale = "Acquisition spend % of revenue: 5.7/3.9/8.2/5.2/12.3% FY21-25 — simple average 7.06%, so mean 7.1% (the old 6.6% was flattering-backward; the endpoint rule applied to sbc_ratio must not be selectively skipped here). Std 2.4%: one draw is held for all 10 years, so dispersion is DECADE-AVERAGE scale — the margin consolidation ruled that at high spend persistence (AR(1) rho~0.8, supported by the accelerating 12.3% endpoint) the decade-average std is ~2.4%, and the prior 1.8% made the FY2025 endpoint a 2.9-sigma event. The fat right tail lives in the lognormal-marginal engine ticket. Truncated at 0: spend cannot be negative (lo now 3.0 sigma out)."

[[drivers]]
name = "ma_recurrence"
stochastic = false
mean = 0.5
rationale = "DETERMINISTIC f=0.50. The correct defense is per-path PAIRING COHERENCE, not 'fake precision' (the old rationale was backwards — sampling would widen the distribution honestly): g_software's mean credits f x acquired growth because f x M&A cost is charged here; sampling f alone would break that pairing path-by-path (a path with f=0.2 would still carry the f=0.5 growth credit). f is a judgment (v3 F2/F16), explored via the published locus in which the growth credit moves WITH f. Headline results are conditional on f=0.50. Single module-level MA_RECURRENCE constant (was hardcoded in two places)."

[[drivers]]
name = "rf"
stochastic = true
mean = 0.046
std = 0.005
dist = "truncnorm"
lo = 0.01
rationale = "10y Treasury ~4.56-4.60% spot (Jul 2026): mean 4.6%. Framing (rewritten): one draw held per path is NOT 'rates are stochastic' year-to-year — it is uncertainty about the PERMANENT COMPONENT of the discount rate over the decade; std 0.5% is calibrated to that permanent-component reading, not annual rate vol. lo=1% is a formal guard only (4.6% is 7.2 sigma away), not a modeling claim."

[[drivers]]
name = "beta"
stochastic = false
mean = 0.85
rationale = "DETERMINISTIC 0.85 on EPISTEMIC grounds: beta is an estimation constant, not a year-to-year random process — sampling it would model our ignorance as world randomness. (Corrected: the old 'sampling beta double-counts ERP vol' claim was technically wrong — a random loading and a random price of risk compound legitimately; the deterministic choice stands on epistemic grounds alone.) Regime risk is real: trailing beta ~0.68 post-crash vs arguably higher forward beta for an AI-capex-levered IBM — probed via the published beta locus (0.68/0.85/1.00) in dcf_drivers_run.py, not sampled."

[[drivers]]
name = "erp"
stochastic = true
mean = 0.045
std = 0.0075
dist = "truncnorm"
lo = 0.02
rationale = "Equity risk premium: mean 4.5% per Damodaran implied ERP (~4.45% Jul-2026; 4.23% Jan-2026) — the old 4.75% was unsourced. Stochastic because the ERP is a STATE VARIABLE of risk appetite, not an estimation constant like beta: it comoves with the demand and rate drivers (see the erp rows of the correlation matrix — that comovement is the point of sampling it). Std 0.75% spans the post-2008 implied-ERP range."

[[drivers]]
name = "kd_spread"
stochastic = false
mean = -0.001
rationale = "DETERMINISTIC -10bp spread over the rf draw; after-tax kd is DERIVED per path as (rf + spread) x (1 - tax_rate), so kd floats with rates and negative-credit-spread paths (3.8% under the old fixed 4.1%) cannot occur. Calibration (adjudicated conflict #2): fair value of the debt stack — blended ~7y ladder yields ~4.45% pre-tax at rf 4.56%, i.e. spread ~ -10bp (IBM's ladder trades through the 10y point because its duration is shorter). The old 4.1% 'after-tax' level failed provenance (it was a pre-tax-looking number) and is retired with the position."

[[drivers]]
name = "tax_rate"
stochastic = false
mean = 0.21
rationale = "DETERMINISTIC 21% statutory federal rate on the debt shield — a disclosed modeling choice (IBM's effective cash tax rate runs lower, which cuts the shield's value). The tau=0 disclosure scenario is run by dcf_drivers_run.py, not by changing this driver."

[[drivers]]
name = "equity_weight"
stochastic = false
mean = 0.72
rationale = "DETERMINISTIC E/V = 0.72: ITERATED price-value fixed point at the driver means (disclosure != treatment — v3 disclosed the circularity of weighting at the $212 market price but kept it; this revision iterates E = model value x shares, V = E + net debt until E/V converges; the iteration itself is shown in dcf_drivers_run.py). Core-debt swap rejected as cherry-picking. Non-stationary weights as debt grows + Harris-Pringle relever remain ticketed."

[[drivers]]
name = "terminal_growth"
stochastic = true
mean = 0.0225
std = 0.0075
rationale = "Long-run nominal growth, mean 2.25% (survives the reviewer's own mix-weighted-fade math). Stochastic while beta is not — the asymmetry is deliberate and defended: tg is a WORLD-STATE OUTCOME (which long-run demand world was realized), correlated with the realized growth draws (the F6 tail-fattening links), whereas beta is an estimation constant about which we are merely uncertain. Std 0.75% (was 0.5% — tightest-to-impact input, widened per review). Engine enforces tg < WACC - 2% jointly per path (T-DCF-2) and now reports the pinned fraction; deriving tg per path from faded segment draws is ticket T-DCF-3."

