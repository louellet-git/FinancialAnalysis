[pytest]
# Keep pytest's default exclusions (venv, build, dist, node_modules, dotdirs such as .venv and
# .claude/worktrees); vendor/ holds the delegation framework with its own unittest suite, tested upstream;
# PLANNING/ holds no tests (a test file pushed there must not run in CI).
norecursedirs = .* venv build dist node_modules *.egg _darcs CVS {arch} vendor data PLANNING
