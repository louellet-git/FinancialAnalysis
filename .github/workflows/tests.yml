name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The Rust program makes the standard variables. Build it before pytest: the
      # Python importer runs it (tests/test_importer.py).
      - run: cargo test --manifest-path rust/mapcheck/Cargo.toml
      - run: cargo build --release --manifest-path rust/mapcheck/Cargo.toml
      - run: python -m pytest -q
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path rust/Cargo.toml --locked
