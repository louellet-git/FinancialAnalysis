name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # The program that makes the standard variables (rust/mapcheck). The Python importer
  # (financial_analysis/importer.py) runs its release build. No Python test remains.
  mapcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path rust/mapcheck/Cargo.toml
      - run: cargo build --release --manifest-path rust/mapcheck/Cargo.toml
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path rust/Cargo.toml --locked
