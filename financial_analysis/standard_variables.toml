# ============================================================================
# ROLLUPS
# ============================================================================
# The SEC companyfacts source does not say which lines are parts of which line.
# A tag can be a line on the statement for one filer and a detail inside a different
# line for a second filer (for example income taxes payable inside accrued
# liabilities). Thus each rollup has two lists:
#   parts    lines that are usually separate lines on the statement
#   details  lines that are frequently a detail inside one of the parts
# The test adds the parts. Then it adds each detail only if the sum stays in the
# total. A detail that does not fit is "nested" for that filer: do not add it to the
# other lines of that filer.

[[rollup]]
name = "current_assets"
total = "total_current_assets"
parts = ["cash_and_equivalents", "short_term_investments", "accounts_receivable_net", "inventory"]
details = ["prepaid_and_other_current_assets", "prepaid_expenses", "contract_assets_current", "other_receivables_current"]
combined = { cash_and_short_term_investments = ["cash_and_equivalents", "short_term_investments"] }

[[rollup]]
name = "assets"
total = "total_assets"
parts = ["total_current_assets", "ppe_net", "goodwill", "long_term_investments", "other_noncurrent_assets"]
details = ["intangibles_net", "operating_lease_rou_assets", "deferred_tax_assets", "equity_method_investments"]

[[rollup]]
name = "current_liabilities"
total = "total_current_liabilities"
parts = ["accounts_payable", "accrued_liabilities", "debt_current"]
details = ["deferred_revenue_current", "other_current_liabilities", "other_accrued_liabilities", "accrued_compensation", "income_taxes_payable", "operating_lease_liabilities_current", "dividends_payable", "interest_payable"]
combined = { accounts_payable_and_accrued = ["accounts_payable", "accrued_liabilities"] }

[[rollup]]
name = "liabilities"
total = "total_liabilities"
parts = ["total_current_liabilities", "long_term_debt"]
details = ["other_noncurrent_liabilities", "deferred_revenue_noncurrent", "operating_lease_liabilities_noncurrent", "pension_liabilities_noncurrent", "deferred_tax_liabilities", "income_taxes_payable_noncurrent", "asset_retirement_obligations_noncurrent"]

[[rollup]]
name = "liabilities_and_equity"
total = "total_liabilities_and_equity"
parts = ["total_liabilities", "temporary_equity", "total_equity_incl_nci"]
exact = true

[[rollup]]
name = "investing_cash_flow"
total = "net_cash_from_investing"
parts = ["capex", "capitalized_software", "purchases_of_intangibles", "purchases_investments", "proceeds_investments", "acquisitions_net_of_cash", "acquisitions_net_of_cash_second", "proceeds_divestitures", "proceeds_sale_ppe", "other_investing"]
signed = true

[[rollup]]
name = "financing_cash_flow"
total = "net_cash_from_financing"
parts = ["repurchases_common_stock", "taxes_paid_net_share_settlement", "dividends_paid", "proceeds_issuance_debt", "repayment_of_debt", "proceeds_short_term_debt", "repayment_short_term_debt", "net_short_term_borrowings", "proceeds_stock_issuance", "other_financing"]
signed = true

[[rollup]]
name = "change_in_cash"
total = "net_change_in_cash"
parts = ["operating_cash_flow", "net_cash_from_investing", "net_cash_from_financing", "fx_effect_on_cash"]
signed = true
exact = true

# A variable that must not be larger than a total. The parts and details of the
# rollups above are checked against their total automatically; this list adds
# variables that are not in a rollup.

[[within]]
part = "total_debt"
total = "total_liabilities"

[[within]]
part = "cash_and_short_term_investments"
total = "total_current_assets"

[[within]]
part = "accounts_payable_and_accrued"
total = "total_current_liabilities"

[[within]]
part = "operating_lease_liabilities"
total = "total_liabilities"

[[within]]
part = "finance_lease_liabilities"
total = "total_liabilities"

# ============================================================================
# EXCLUDED TAGS
# ============================================================================

[[excluded]]
pattern = '^ComprehensiveIncome|^OtherComprehensiveIncome|^AccumulatedOtherComprehensiveIncome'
reason = "other comprehensive income is not a DCF input"

[[excluded]]
pattern = '^IncomeTaxReconciliation|^UnrecognizedTaxBenefits|^DeferredTaxAssets|^DeferredTaxLiabilities|^DeferredIncomeTaxLiabilities$|^(Current|Deferred)(Federal|Foreign|StateAndLocal)?(Income)?TaxExpenseBenefit$|^IncomeTaxPaid|^EffectiveIncomeTaxRate|^DeferredFederal|^CurrentFederal|^CurrentForeign|^DeferredForeign'
reason = "tax note detail; tax expense, tax paid and the net deferred tax lines have variables"

[[excluded]]
pattern = '^LongTermDebtMaturities|^LesseeOperatingLeaseLiabilityPaymentsDue|^FinanceLeaseLiabilityPaymentsDue|^ContractualObligation|^OperatingLeasesFutureMinimumPayments|^LesseeOperatingLeaseLiabilityUndiscounted|^FinanceLeaseLiabilityUndiscounted|^UnrecordedUnconditionalPurchaseObligation|^PurchaseObligation'
reason = "maturity schedule in the notes; the balance has a variable"

[[excluded]]
pattern = 'FairValue|^AssetsFairValueDisclosure|^DerivativeNotional|^Derivative|^AvailableForSale|^DebtSecuritiesAvailableForSale|^EquitySecuritiesFvNi|^HeldToMaturity|^DebtInstrument(CarryingAmount|FaceAmount)'
reason = "fair-value or instrument note; the balance-sheet line has a variable"

[[excluded]]
pattern = '^CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents'
reason = "cash-flow statement cash total; cash_and_equivalents has a variable"

[[excluded]]
pattern = '^StockIssuedDuringPeriod|^StockRepurchased|^AdjustmentsToAdditionalPaidInCapital|^AdditionalPaidInCapital|^CommonStock|^TreasuryStock|^Dividends|^StockholdersEquityOther|^PreferredStock|^MinorityInterestDecrease'
reason = "equity statement detail; total equity has a variable"

[[excluded]]
pattern = '^NetIncomeLossAttributableToParentDiluted|^IncomeLossFromContinuingOperations(IncludingPortionAttributableToNoncontrollingInterest)?$|^NetIncomeLossIncludingPortionAttributableToNonredeemableNoncontrollingInterest$|^UndistributedEarnings|^IncomeLossFromContinuingOperationsPerBasicShare'
reason = "net income for another group of holders; net_income has a variable"

[[excluded]]
pattern = '^FiniteLivedIntangibleAssets(Gross|AccumulatedAmortization)|^IntangibleAssetsGrossExcludingGoodwill|^FiniteLivedIntangibleAssetsAmortizationExpense|^Goodwill(AcquiredDuringPeriod|Gross|Impaired|Translation|Other|Foreign|PeriodIncrease|WrittenOff|Purchase)'
reason = "intangible asset note detail; the net balances have variables"

[[excluded]]
pattern = '^AllocatedShareBasedCompensationExpenseNetOfTax|^EmployeeServiceShareBasedCompensation|^ShareBasedCompensationArrangement'
reason = "share-based compensation note; sbc_total has a variable"

[[excluded]]
pattern = '^DefinedBenefitPlan|^DefinedContributionPlan|^PensionAndOtherPostretirementBenefit'
reason = "pension note detail"

[[excluded]]
pattern = '^NoncurrentAssets$|^AssetsNoncurrent$|^LiabilitiesNoncurrent$|^Liabilities(AndStockholdersEquity)?Abstract'
reason = "subtotal that few filers give"

[[excluded]]
pattern = '^SupplierFinanceProgram|^ContractWithCustomerLiability(RevenueRecognized)?$|^RevenueRemainingPerformanceObligation|^ContractWithCustomerAsset|^SegmentExpenditure|^SegmentReporting|^Noncash|^CapitalExpendituresIncurredButNotYetPaid|^RightOfUseAssetObtained|^OperatingLeaseCost|^OperatingLeasePayments|^LeaseCost|^OperatingLeaseExpense'
reason = "note disclosure, not a statement line"

[[excluded]]
pattern = '^BusinessCombination|^BusinessAcquisition|^DisposalGroup|^AssetsOfDisposalGroup|^LiabilitiesOfDisposalGroup|^AssetsHeldForSale'
reason = "acquisition or disposal note"

[[excluded]]
pattern = '^Cash$|^CashEquivalentsAtCarryingValue$|^RestrictedCash'
reason = "part of cash; cash_and_equivalents has a variable"

[[excluded]]
pattern = '^InventoryFinishedGoods|^InventoryWorkInProcess|^InventoryRawMaterials|^InventoryGross|^InventoryLIFOReserve|^InventoryValuationReserves'
reason = "inventory note detail; inventory has a variable"

[[excluded]]
pattern = '^PropertyPlantAndEquipmentAdditions|^ConstructionInProgressGross|^Land$|^BuildingsAndImprovementsGross|^MachineryAndEquipmentGross|^FurnitureAndFixturesGross|^LeaseholdImprovementsGross|^CapitalizedComputerSoftware'
reason = "property note detail; ppe_gross and ppe_net have variables"
