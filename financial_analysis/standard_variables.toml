# Registry of standard variables: the one mapping from XBRL tags to model inputs.
# Python (financial_analysis/xbrl_tags.py) and Rust (rust/mapcheck) read this file.
# The sequence of the [[variable]] entries is the sequence of the schema fields.
#
# [[variable]]
#   name       standard variable name (a field of PeriodFinancials)
#   statement  income_statement | balance_sheet | cash_flow | disclosure
#              (income_statement and cash_flow values are flows over the period;
#              balance_sheet and disclosure values are balances on the end date)
#   tags       XBRL tags with the SAME scope as the variable, in a fixed sequence.
#              The list can be empty if the variable has a formula.
#              For each period the first tag that has a fact gives the value. A tag
#              with a different scope (a part, or a larger total) gets its own
#              variable. One tag is in one variable only.
#   formulas   used only when no tag has a fact. Variables with + and -. A term that
#              ends with ? is optional (a missing value counts as zero, but one term
#              must have a value). Formulas are tried in sequence. In a sum, two
#              terms with the same value count one time (one item with two tags).
#   unit       USD (default) | USD/shares | shares
#   sign_flip  true: the value is stored as a negative number (a cash outflow)
#   negate     true: the sign of the tag value is changed (for a tag that is positive
#              for a payment, but can be a payment or a receipt)
#   unclassified_only  tags (a subset of tags) that give a value only if the filer has no
#              current-assets total (a fund or a mortgage REIT)
#   scoped_min_assets_share  the unclassified_only tags also need a value of this share of
#              total assets or more (a small interest income is not revenue). A total
#              assets of 0 or less, or none, counts as unknown: no share test. The
#              share is for a year; a quarter uses a quarter of it. Range 0 to 1.
#   core       true: a core DCF input
#   memo       true: an "of which" number (a note detail, a part of one line, or a
#              per-share number). The amount is already inside a line variable of
#              its statement. Never add a memo variable to line variables: this
#              counts the amount two times. A formula must not mix memo and line
#              variables (a one-term fallback is permitted), and a rollup has no
#              memo variable.
#   note       scope and precedence
#
# [[rollup]]   a total and the line variables that are its parts. The test framework
#              compares the sum of the parts with the total: parts larger than the
#              total show an overlap (a double count if you add them); a large
#              remainder shows lines with no variable. "combined" maps a one-line
#              variable to the parts it replaces when the filer shows one line.
#              Read the comment at the ROLLUPS section.
#
# [[within]]   a variable that must not be larger than a total.
#
# [[excluded]] material tags that have no variable on purpose, with the reason.

version = 1

# A period (fiscal year or quarter) exists only if one of these tags has a fact of
# the correct length for it.
anchors = [
    "us-gaap/Revenues",
    "us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax",
    "us-gaap/RevenueFromContractWithCustomerIncludingAssessedTax",
    "us-gaap/SalesRevenueNet",
    "us-gaap/NetIncomeLoss",
    "us-gaap/ProfitLoss",
    "us-gaap/NetCashProvidedByUsedInOperatingActivities",
    "us-gaap/IncomeTaxExpenseBenefit",
    "us-gaap/RegulatedAndUnregulatedOperatingRevenue",
    "us-gaap/RevenuesNetOfInterestExpense",
    "ifrs-full/Revenue",
    "ifrs-full/ProfitLoss",
    "ifrs-full/ProfitLossAttributableToOwnersOfParent",
    "ifrs-full/CashFlowsFromUsedInOperatingActivities",
]

# ============================================================================
# INCOME STATEMENT
# ============================================================================

[[variable]]
name = "revenue"
statement = "income_statement"
core = true
note = "Top line of the income statement. The tags are the tags of a total. A filer with none of them gets the value from a formula, in this sequence. (1) A bank: net interest income and noninterest income. A bank uses the contract-revenue tag only for a small part of its income, thus this formula comes before it. (2) The contract-revenue tag (most companies after 2018) or the sales tag (before 2018). (3) A pre-2018 total tag of a filer with no other total (revenue_total_pre2018). (4) A landlord with only a lease-income tag. (5) An investment company."
tags = [
    "us-gaap/Revenues",
    "us-gaap/RegulatedAndUnregulatedOperatingRevenue",
    "us-gaap/RevenuesNetOfInterestExpense",
    "ifrs-full/Revenue",
]
formulas = [
    "net_interest_income + noninterest_income",
    "revenue_from_contracts",
    "revenue_total_pre2018",
    "lease_income",
    "investment_income_operating",
]

[[variable]]
name = "revenue_from_contracts"
statement = "income_statement"
note = "Revenue from contract with customers (ASC 606). For most companies it is the full revenue. For a bank, a utility or a lessor it is a part of revenue. SalesRevenueNet is the tag for the same line before 2018; it comes after the contract tags, because a later filing gives the earlier years again with the contract tag."
tags = [
    "us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax",
    "us-gaap/RevenueFromContractWithCustomerIncludingAssessedTax",
    "us-gaap/SalesRevenueNet",
]

[[variable]]
name = "revenue_total_pre2018"
statement = "income_statement"
note = "A revenue tag of filers before ASC 606. This variable has a value for each period with one of these tags, also where it is only a part of revenue: do not read it as revenue. Only the formula of revenue uses it, after revenue_from_contracts, thus it fills an empty period of revenue only and never replaces a value. The tags are the goods tag (a seller of goods), the services tag (a seller of services), and the total tags of an industry (refining, utility, hospital operator). RealEstateRevenueNet is the total revenue of a lessor. Excise taxes can be in these totals before 2018 (docs/traps/2026-11-21-revenue-excise-before-2018.md)."
tags = [
    "us-gaap/SalesRevenueGoodsNet",
    "us-gaap/SalesRevenueServicesNet",
    "us-gaap/RefiningAndMarketingRevenue",
    "us-gaap/UtilityRevenue",
    "us-gaap/HealthCareOrganizationRevenue",
    "us-gaap/RealEstateRevenueNet",
]

[[variable]]
name = "lease_income"
statement = "income_statement"
note = "Income of a lessor from operating leases. For a landlord (a residential REIT) it is the top line. For other companies it is a part of revenue."
tags = [
    "us-gaap/OperatingLeaseLeaseIncome",
]

[[variable]]
name = "investment_income_operating"
statement = "income_statement"
note = "Top line of an investment company: total investment income. A mortgage REIT has no revenue total: its top line is the interest income on its loans and securities (tags 2 and 3). The first tag is a total of investment income, and the others are interest income only. The tag for interest income on debt securities is not used: a biotech with no revenue has it. Tags 2 and 3 (key unclassified_only) give a value only if the filer has no current-assets total and the value is 1% or more of total assets (key scoped_min_assets_share). A filer with a current-assets total in any period is classified for all its periods. A company with a classified balance sheet (APTV, AGCO, a biotech with cash investments), and an equity REIT with a small interest income (ARE, UMH), have interest income that is not their revenue."
unclassified_only = [
    "us-gaap/InterestAndDividendIncomeOperating",
    "us-gaap/InterestIncomeOperating",
]
scoped_min_assets_share = 0.01
tags = [
    "us-gaap/GrossInvestmentIncomeOperating",
    "us-gaap/InterestAndDividendIncomeOperating",
    "us-gaap/InterestIncomeOperating",
]

[[variable]]
name = "net_interest_income"
statement = "income_statement"
note = "Banks: interest income less interest expense."
tags = [
    "us-gaap/InterestIncomeExpenseNet",
]

[[variable]]
name = "noninterest_income"
statement = "income_statement"
note = "Banks: fees and other income that is not interest."
tags = [
    "us-gaap/NoninterestIncome",
]

[[variable]]
name = "cogs_total"
statement = "income_statement"
tags = [
    "us-gaap/CostOfRevenue",
    "us-gaap/CostOfGoodsAndServicesSold",
    "us-gaap/CostOfGoodsSold",
    "ifrs-full/CostOfSales",
]

[[variable]]
name = "gross_profit"
statement = "income_statement"
tags = [
    "us-gaap/GrossProfit",
    "ifrs-full/GrossProfit",
]
formulas = ["revenue - cogs_total"]

[[variable]]
name = "rd_expense"
statement = "income_statement"
tags = [
