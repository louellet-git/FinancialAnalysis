]

[[variable]]
name = "sga_expense"
statement = "income_statement"
tags = [
    "us-gaap/SellingGeneralAndAdministrativeExpense",
]
formulas = ["sm_expense + ga_expense"]

[[variable]]
name = "advertising_expense"
statement = "income_statement"
memo = true
note = "A part of selling expense that many filers give in the notes."
tags = [
    "us-gaap/AdvertisingExpense",
    "us-gaap/MarketingAndAdvertisingExpense",
]

[[variable]]
name = "opex_amortization"
statement = "income_statement"
memo = true
tags = [
    "us-gaap/AmortizationOfIntangibleAssets",
]

[[variable]]
name = "opex_restructuring"
statement = "income_statement"
tags = [
    "us-gaap/RestructuringCharges",
    "us-gaap/RestructuringCostsAndAssetImpairmentCharges",
]

[[variable]]
name = "goodwill_impairment"
statement = "income_statement"
memo = true
tags = [
    "us-gaap/GoodwillImpairmentLoss",
]

[[variable]]
name = "asset_impairment"
statement = "income_statement"
memo = true
tags = [
    "us-gaap/AssetImpairmentCharges",
]

[[variable]]
name = "operating_expenses_total"
statement = "income_statement"
note = "Operating expenses below gross profit (cost of revenue is not included)."
tags = [
    "us-gaap/OperatingExpenses",
]

[[variable]]
name = "costs_and_expenses_total"
statement = "income_statement"
note = "All costs and expenses. For some filers this includes interest and other non-operating items, thus no formula uses it."
tags = [
    "us-gaap/CostsAndExpenses",
]

[[variable]]
name = "operating_income"
statement = "income_statement"
tags = [
    "us-gaap/OperatingIncomeLoss",
    "ifrs-full/ProfitLossFromOperatingActivities",
]
formulas = ["gross_profit - operating_expenses_total"]

[[variable]]
name = "interest_income"
statement = "income_statement"
note = "Precedence: InterestIncomeNonoperating (the most specific \"interest earned, non-operating\" concept) > InvestmentIncomeInterest (interest on investments; common for cash-rich tech filers) > InvestmentIncomeInterestAndDividend > InterestIncomeOther (catch-all \"other interest income\"; IBM reports ONLY this one). Specific-before-generic so a filer tagging both never gets the catch-all."
tags = [
    "us-gaap/InterestIncomeNonoperating",
    "us-gaap/InvestmentIncomeInterest",
    "us-gaap/InvestmentIncomeInterestAndDividend",
    "us-gaap/InterestIncomeOther",
]

[[variable]]
name = "interest_expense"
statement = "income_statement"
core = true
note = "Interest cost on debt. InterestExpenseOperating (banks, REITs) is not in the list: for a bank it is a cost of the business, not a financing cost. Fallback: cash interest paid, for a filer that has no standard interest-expense tag (it uses a company-specific tag). This is an approximate value; the source shows \"= interest_paid\"."
tags = [
    "us-gaap/InterestExpense",
    "us-gaap/InterestExpenseNonoperating",
    "us-gaap/InterestExpenseDebt",
    "us-gaap/InterestAndDebtExpense",
    "ifrs-full/InterestExpense",
]
formulas = ["interest_paid"]

[[variable]]
name = "interest_net_nonoperating"
statement = "income_statement"
note = "Interest income less interest expense. Some filers give only this net number."
tags = [
    "us-gaap/InterestIncomeExpenseNonoperatingNet",
]
formulas = ["interest_income - interest_expense"]

[[variable]]
name = "gains_losses_on_investments"
statement = "income_statement"
tags = [
    "us-gaap/GainLossOnInvestments",
]

[[variable]]
name = "other_nonop_income"
statement = "income_statement"
tags = [
    "us-gaap/OtherNonoperatingIncomeExpense",
]

[[variable]]
name = "nonoperating_income_total"
statement = "income_statement"
tags = [
    "us-gaap/NonoperatingIncomeExpense",
]

[[variable]]
name = "equity_method_income"
statement = "income_statement"
tags = [
    "us-gaap/IncomeLossFromEquityMethodInvestments",
]

[[variable]]
name = "income_before_tax"
statement = "income_statement"
core = true
tags = [
    "us-gaap/IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest",
    "us-gaap/IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments",
    "ifrs-full/ProfitLossBeforeTax",
]
formulas = ["income_before_tax_domestic + income_before_tax_foreign"]

[[variable]]
name = "income_before_tax_domestic"
statement = "income_statement"
memo = true
note = "Split of pre-tax income from the tax note."
tags = [
    "us-gaap/IncomeLossFromContinuingOperationsBeforeIncomeTaxesDomestic",
]

[[variable]]
name = "income_before_tax_foreign"
