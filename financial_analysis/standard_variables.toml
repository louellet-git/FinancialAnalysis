note = "Net income that belongs to the shareholders of the parent company."
tags = [
    "us-gaap/NetIncomeLoss",
    "ifrs-full/ProfitLossAttributableToOwnersOfParent",
]
formulas = ["net_income_incl_nci - net_income_noncontrolling", "net_income_incl_nci", "net_income_to_common"]

[[variable]]
name = "net_income_incl_nci"
